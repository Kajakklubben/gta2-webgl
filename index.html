<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>__APPLICATION_TITLE__</title>
  <link rel="stylesheet" href="/src/client/ui/ui.css">
  <style>
    body { margin: 0; overflow: hidden; background: #111820; color: #ecf2f8; font: 15px system-ui, sans-serif; touch-action: none; -webkit-tap-highlight-color: transparent; }
    canvas { display: block; }
    button { font: inherit; cursor: pointer; touch-action: none; }
  </style>
</head>
<body>
  <main id="game"></main>

  <nav id="top-toolbar" aria-label="Game menu">
    <button id="open-menu" class="menu-button" type="button" aria-expanded="false" aria-controls="game-menu">Menu</button>
  </nav>

  <div id="menu-backdrop" hidden></div>
  <aside id="game-menu" class="menu-surface menu-layout menu-layout--root" hidden aria-label="Game menu" role="dialog" aria-modal="false"></aside>

  <aside id="local-menu" class="menu-surface menu-layout" hidden aria-label="Local game setup" role="dialog" aria-modal="false">
    <div class="menu-surface-header local-menu-header"><strong id="local-menu-title">Single player</strong><button id="close-local-menu" class="menu-button" type="button">Back</button></div>
    <label class="menu-field">Map <select id="local-map" class="menu-select"></select></label>
    <button id="start-local-game" class="menu-button" type="button">Start</button>
  </aside>

  <aside id="debug-menu" class="menu-surface menu-layout" hidden aria-label="Debug tools" role="dialog" aria-modal="false">
    <div class="debug-menu-header"><strong>Debug tools</strong><div class="debug-menu-header-actions"><a id="open-scenarios" class="menu-button" href="/scenarios.html">Scenarios</a><a id="open-sprites" class="menu-button" href="/sprites.html">Sprites</a><button id="close-debug" class="menu-button" type="button" aria-label="Close debug menu">Close</button></div></div>

    <section id="debug-graphs" class="debug-section">
      <h2 class="debug-section-title">Traffic</h2>
      <div class="debug-control-grid">
        <label class="menu-checkbox-field"><input id="debug-pedestrian-graph" class="menu-checkbox" type="checkbox"> Pedestrian graph</label>
        <label class="menu-checkbox-field"><input id="debug-traffic" class="menu-checkbox" type="checkbox"> Traffic</label>
        <label class="menu-checkbox-field"><input id="debug-car" class="menu-checkbox" type="checkbox"> Cars</label>
        <label class="menu-checkbox-field"><input id="debug-zones" class="menu-checkbox" type="checkbox"> Zones</label>
        <label class="menu-checkbox-field"><input id="debug-police-attack" class="menu-checkbox" type="checkbox"> Police attack player</label>
      </div>
    </section>

    <section id="debug-map" class="debug-section">
      <h2 class="debug-section-title">Map</h2>
      <label class="menu-checkbox-field"><input id="debug-tile-picker" class="menu-checkbox" type="checkbox"> Select surface</label>
      <label class="menu-field">Enabled map levels (Cmd/Ctrl-click to toggle) <select id="debug-map-levels" class="menu-select" multiple size="4" aria-label="Enabled map levels"></select></label>
    </section>

    <section id="debug-player" class="debug-section">
      <h2 class="debug-section-title">Player</h2>
      <div class="debug-group">
        <h3 class="debug-group-title">Vehicle</h3>
        <div class="debug-control-grid">
          <label class="menu-checkbox-field"><input id="debug-vehicle-doors" class="menu-checkbox" type="checkbox"> Vehicle doors</label>
          <label class="menu-checkbox-field"><input id="debug-closest-door" class="menu-checkbox" type="checkbox"> Line to closest door</label>
        </div>
      </div>
      <div class="debug-group">
        <h3 class="debug-group-title">State</h3>
        <label class="menu-checkbox-field"><input id="debug-show-player-state" class="menu-checkbox" type="checkbox"> Show player/car state overlay</label>
      </div>
    </section>

    <section id="debug-camera" class="debug-section">
      <h2 class="debug-section-title">Camera</h2>
      <label class="menu-field">Camera mode <select id="debug-camera-mode" class="menu-select"><option value="follow">Follow (1:1)</option><option value="detached">Detached (WASD / Shift-W, Shift-S / page keys)</option></select></label>
    </section>

    <section class="debug-section debug-final-actions" aria-label="Debug actions">
      <button id="debug-reset-world" class="menu-button" type="button">Reset world</button>
      <button id="debug-give-all-weapons" class="menu-button" type="button" disabled>Give all weapons</button>
    </section>

  </aside>

  <aside id="graphics-menu" class="menu-surface menu-layout" hidden aria-label="Graphics" role="dialog" aria-modal="false"></aside>

  <div id="lobby" class="menu-surface menu-layout menu-layout--lobby" hidden aria-label="Multiplayer" role="dialog" aria-modal="false">
    <div class="menu-surface-header"><strong>Multiplayer</strong><button id="close-lobby" class="menu-button" type="button">Back</button></div>
    <label class="menu-field">Mode <select id="mode" class="menu-select"><option value="singleplayer">Single player</option><option value="online">Multiplayer</option><option value="local">Local split-screen</option></select></label>
    <label class="menu-field">Name <input id="name" class="menu-input" maxlength="32" placeholder="Random name"></label>
    <label class="menu-field">Room <input id="room" class="menu-input" maxlength="24" value="main"></label>
    <label class="menu-field">Team <select id="team" class="menu-select"><option value="0">Free for all</option><option value="1">Red</option><option value="2">Blue</option><option value="3">Green</option></select></label>
    <label class="menu-field">Map <select id="map" class="menu-select"></select></label>
    <div class="menu-actions"><button id="join" class="menu-button">Apply &amp; reconnect</button><button id="ready" class="menu-button" disabled>Ready</button><button id="local-reset" class="menu-button" type="button" hidden>Reset local match</button><button id="local-leave" class="menu-button" type="button" hidden>Leave local match</button></div><span id="roomstate"></span>
  </div>

  <div id="status" role="status">
    <div class="loading-card"><div class="loading-badge" aria-hidden="true">GTA2</div><h1>Grand Theft Auto 2</h1><p id="message">Loading GTA2 assets…</p><div class="loading-track" aria-hidden="true"><span></span></div><button id="reconnect" hidden>Reconnect</button></div>
  </div>

  <div id="player-huds" aria-label="Player status">
    <template id="player-hud-template">
      <section class="player-hud">
        <div class="hud-player-name" data-field="name"></div>
        <div class="hud-weapon"><canvas class="hud-weapon-icon" data-field="weapon-icon" width="64" height="42" aria-hidden="true"></canvas><div class="hud-weapon-copy"><strong data-field="weapon-name">PISTOL</strong><span data-field="ammo">AMMO 60</span></div></div>
        <div class="hud-health"><span class="hud-caption">HEALTH</span><span class="hud-hearts" data-field="hearts" aria-label="Health">♥♥♥♥♥</span></div>
        <div class="hud-armor"><span class="hud-caption">ARMOR</span><strong data-field="armor">000</strong></div>
        <div class="hud-wanted"><span class="hud-caption">WANTED</span><strong data-field="wanted">☆☆☆☆☆</strong></div>
        <div class="hud-money"><strong data-field="money">$000000</strong><span><span class="hud-caption">SCORE</span> <b data-field="score">000000</b></span></div>
        <div class="hud-vehicle" data-field="vehicle" hidden><span class="hud-caption">CAR</span><strong data-field="vehicle-value">100%</strong></div>
        <div class="hud-status" data-field="status" aria-live="polite"></div>
      </section>
    </template>
  </div>
  <div id="local-paused" hidden><div>PAUSED<br><small>Press Escape to resume</small><div class="local-pause-actions"><button id="local-resume" class="menu-button" type="button">Resume</button><button id="local-pause-leave" class="menu-button" type="button">Leave match</button></div></div></div>
  <div id="fps-counter" hidden aria-live="polite">FPS —</div>
  <output id="debug-player-state-overlay" hidden aria-label="Current player and vehicle state"></output>
  <output id="debug-map-tile-overlay" hidden aria-label="Selected map tile state"></output>

  <div id="scoreboard" class="menu-surface" hidden aria-label="Scoreboard" role="dialog" aria-modal="false"></div>
  <div id="feed" hidden></div>
  <div id="chat" class="menu-surface" hidden aria-label="Chat" role="dialog" aria-modal="false"><div class="menu-surface-header"><strong>Chat</strong><button id="close-chat" class="menu-button" type="button">Back</button></div><div id="chatlog"></div><input id="chatinput" class="menu-input" maxlength="240" placeholder="Chat…"></div>
  <div id="touch-controls" aria-label="Touch controls">
    <div id="touch-joystick" role="application" aria-label="Movement joystick">
      <div class="touch-joystick-base"><div id="touch-joystick-knob"></div></div>
    </div>
    <button id="touch-jump" data-pulse="jump" aria-label="Jump"><span>JUMP</span></button>
    <button id="touch-fire" data-key="Space" aria-label="Fire"><span>FIRE</span></button>
    <button id="touch-weapon-previous" data-pulse="weapon-previous" aria-label="Previous weapon"><span>PREV</span></button>
    <button id="touch-weapon-next" data-pulse="weapon-next" aria-label="Next weapon"><span>NEXT</span></button>
  </div>

  <script type="module" src="/src/client/app/main.ts"></script>
</body>
</html>
