<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <title>Gameplay Scenarios · Grand Theft Kayak 2</title>
  <link rel="stylesheet" href="/src/client/ui/ui.css">
  <style>
    body { margin: 0; min-height: 100vh; overflow: auto; background: #111820; color: #ecf2f8; font: 15px system-ui, sans-serif; touch-action: pan-y; -webkit-text-size-adjust: 100%; overscroll-behavior-x: none; }
    button, select { min-height: 38px; font: inherit; cursor: pointer; touch-action: manipulation; }
    .scenario-page-shell { min-height: 100vh; padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left)); box-sizing: border-box; }
    #vehicle-entry-lab { position: static; width: min(900px, 100%); max-height: none; margin: 0 auto; }
    #gameplay-scenario-lab { width: 100%; margin: 0; padding: 0; box-sizing: border-box; }
    .scenario-viewer-mode { display: flex; align-items: center; gap: 6px; color: #b6c9dc; font-size: 12px; }
    .scenario-viewer-mode select { min-height: 32px; }
    .gameplay-lab-controls { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; }
    .gameplay-lab-controls label { display: grid; gap: 3px; color: #b6c9dc; font-size: 12px; }
    .gameplay-lab-actions { display: flex; align-items: center; gap: 8px; margin: 9px 0; color: #c9d7e4; font-size: 12px; }
    .gameplay-lab-actions span { margin-left: auto; }
    #gameplay-scenario-lab button { border: 1px solid #6b86a0; border-radius: 5px; padding: 5px 8px; background: #1b3045; color: #fff; }
    #gameplay-preview-stage { position: relative; width: 100%; }
    #gameplay-preview, #gameplay-sprites { display: block; width: 100%; height: auto; box-sizing: border-box; border: 1px solid #3e5870; border-radius: 5px; image-rendering: pixelated; background: #0a1118; }
    #gameplay-sprites { position: absolute; inset: 0; pointer-events: none; background: transparent; }
    #gameplay-title { margin: 12px 0 4px; font-size: 17px; }
    #gameplay-status, #gameplay-detail { margin: 4px 0; color: #c9d7e4; }
    #gameplay-status { color: #f6ca66; font-weight: 600; }
    @media (max-width: 700px) {
      #vehicle-entry-lab { padding: 10px; border-radius: 6px; }
      .entry-lab-controls { grid-template-columns: 1fr; }
      .entry-lab-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); align-items: stretch; }
      .entry-lab-actions span { grid-column: 1 / -1; margin-left: 0; text-align: right; }
      .gameplay-lab-actions { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .gameplay-lab-actions span { grid-column: 1 / -1; margin-left: 0; text-align: right; }
    }
  </style>
</head>
<body>
  <main class="scenario-page-shell">
    <section id="vehicle-entry-lab" aria-label="Vehicle scenarios" role="main">
      <div class="entry-lab-header"><strong>Scenarios</strong><label class="scenario-viewer-mode">Viewer <select id="scenario-viewer-mode" aria-label="Scenario viewer"><option value="vehicle">Vehicle entry / exit</option><option value="gameplay">Jump, impact, and water</option></select></label><button id="close-entry-lab" type="button" aria-label="Back to game">Back to game</button></div>
      <div id="vehicle-entry-viewer">
        <div class="entry-lab-controls"><label>Car <select id="entry-car"></select></label><label>Action <select id="entry-action"></select></label><label>Scenario / approach <select id="entry-scenario-approach"></select></label><label>Simulation speed <select id="entry-speed" aria-label="Vehicle simulation speed"></select></label></div>
        <details id="entry-property-coverage" class="entry-property-coverage"><summary>Vehicle metadata</summary><div id="entry-property-cases" role="list" aria-label="Vehicle property test cases"></div><p id="entry-property-summary" class="entry-property-summary"></p></details>
        <div class="entry-lab-actions"><button id="entry-restart" type="button">Reset</button><button id="entry-play" type="button" aria-pressed="true">Pause</button><button id="entry-step" type="button">Step</button><span><output id="entry-progress" aria-label="Progress">0%</output></span></div>
        <div class="entry-preview-stage"><canvas id="entry-preview" width="900" height="480" aria-label="Vehicle scenario preview"></canvas><canvas id="entry-overlay" width="900" height="480" aria-label="Vehicle scenario diagnostics"></canvas></div>
        <div class="entry-door-caption">Door animation</div>
        <div class="entry-door-stage"><canvas id="entry-door-preview" width="900" height="112" aria-label="Selected door animation frames"></canvas><canvas id="entry-door-overlay" width="900" height="112" aria-label="Selected door animation labels"></canvas></div>
        <h2 id="entry-title">Vehicle scenario</h2><p id="entry-status" class="entry-status"></p><p id="entry-detail" class="entry-detail"></p>
      </div>
      <section id="gameplay-scenario-lab" aria-label="Gameplay scenarios" role="region" hidden>
        <div class="gameplay-lab-controls"><label>Level / replay <select id="gameplay-scenario"></select></label><label>Simulation speed <select id="gameplay-speed" aria-label="Gameplay simulation speed"></select></label></div>
        <div class="gameplay-lab-actions"><button id="gameplay-restart" type="button">Reset</button><button id="gameplay-play" type="button" aria-pressed="true">Pause</button><button id="gameplay-step" type="button">Step</button><span><output id="gameplay-progress" aria-label="Gameplay scenario progress">0/0</output></span></div>
        <div id="gameplay-preview-stage"><canvas id="gameplay-preview" width="900" height="480" aria-label="Gameplay scenario map preview"></canvas><canvas id="gameplay-sprites" width="900" height="480" aria-label="Gameplay actor graphics"></canvas></div>
        <h2 id="gameplay-title">Gameplay scenario</h2><p id="gameplay-status" class="entry-status"></p><p id="gameplay-detail" class="entry-detail"></p>
      </section>
    </section>
  </main>
  <script type="module" src="/src/client/app/scenarios.ts"></script>
</body>
</html>
